<!DOCTYPE html>
<html lang="en">

<head>

    <title>SHARGI | THE GOAT</title>

    <style>

        /* =========================
           FONTS
        ========================= */

        @font-face {
            font-family: "Mantinia";
            src: url("Mantinia-Regular.ttf");
        }

        @font-face {
            font-family: "TT Commons Black";
            src: url("TT_Commons_Black.ttf");
        }


        /* =========================
           BASIC PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #ff8de1,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #8c52ff,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #16001f,
                    #3b064f,
                    #12001c
                );

            color: white;

            font-family: "Mantinia", Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           ANIMATED GLOW
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            background: #ff4fc3;

            filter: blur(180px);

            opacity: 0.25;

            top: -200px;
            left: -200px;

            animation: glow 6s infinite alternate;

            pointer-events: none;
        }

        @keyframes glow {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(500px, 400px);
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1000px;

            margin: 80px auto;

            text-align: center;
        }


        /* =========================
           TOP LABEL
        ========================= */

        .top-label {
            font-family: "TT Commons Black", Arial, sans-serif;

            letter-spacing: 8px;

            color: #ffb5ec;

            font-size: 18px;

            margin-bottom: 10px;

            text-transform: uppercase;
        }


        /* =========================
           BIG TITLE
        ========================= */

        h1 {
            font-size: clamp(55px, 9vw, 110px);

            line-height: 0.9;

            margin: 0;

            color: white;

            text-transform: uppercase;

            text-shadow:
                0 0 10px #ffffff,
                0 0 30px #ff7ddd,
                0 0 60px #ff2fc2,
                0 0 100px #ff2fc2;

            animation: titleGlow 3s infinite alternate;
        }

        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 10px white,
                    0 0 30px #ff7ddd,
                    0 0 60px #ff2fc2;
            }

            to {
                text-shadow:
                    0 0 20px white,
                    0 0 50px #ff7ddd,
                    0 0 100px #ff2fc2;
            }
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {
            font-family: "TT Commons Black", Arial, sans-serif;

            font-size: 22px;

            letter-spacing: 3px;

            color: #ffd9f5;

            margin-top: 25px;

            margin-bottom: 50px;
        }


        /* =========================
           IMAGE CARD
        ========================= */

        .image-container {

            display: inline-block;

            padding: 12px;

            border-radius: 30px;

            background: linear-gradient(
                45deg,
                #ffffff,
                #ff4fc3,
                #8c52ff,
                #ffffff
            );

            background-size: 400% 400%;

            animation: borderMove 5s ease infinite;

            box-shadow:
                0 0 30px #ff4fc3,
                0 0 80px rgba(255, 79, 195, 0.5);
        }

        @keyframes borderMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================
           SHARGI IMAGE
        ========================= */

        img {

            display: block;

            width: min(80vw, 600px);

            height: auto;

            max-height: 75vh;

            object-fit: contain;

            border-radius: 20px;

            background: #16001f;

            transition: 0.5s;

        }


        img:hover {

            transform: scale(1.02);

            box-shadow:
                0 0 30px white,
                0 0 60px #ff4fc3;
        }


        /* =========================
           GOAT TEXT
        ========================= */

        .goat {

            font-family: "TT Commons Black", Arial, sans-serif;

            font-size: 30px;

            letter-spacing: 5px;

            margin-top: 45px;

            color: #ffffff;

            text-transform: uppercase;
        }


        /* =========================
           STATS
        ========================= */

        .stats {

            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;

            margin-top: 35px;
        }


        .stat {

            width: 180px;

            padding: 25px 15px;

            border: 1px solid rgba(255,255,255,0.3);

            border-radius: 20px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }


        .stat:hover {

            transform: translateY(-8px);

            background: rgba(255,79,195,0.2);

            box-shadow: 0 0 30px rgba(255,79,195,0.5);
        }


        .stat-number {

            font-family: "TT Commons Black", Arial, sans-serif;

            font-size: 40px;

            color: #ff9de5;
        }


        .stat-label {

            font-family: Arial, sans-serif;

            font-size: 14px;

            letter-spacing: 2px;

            color: #ffffff;
        }


        /* =========================
           BALLON D'OR BAR
        ========================= */

        .award {

            max-width: 600px;

            margin: 60px auto;
        }


        .award-title {

            font-family: "TT Commons Black", Arial, sans-serif;

            font-size: 22px;

            margin-bottom: 15px;

            letter-spacing: 3px;
        }


        .bar {

            height: 20px;

            background: rgba(255,255,255,0.15);

            border-radius: 50px;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.4);
        }


        .bar-fill {

            height: 100%;

            width: 97%;

            background: linear-gradient(
                90deg,
                #fff3a6,
                #ffd700,
                #ff9d00
            );

            border-radius: 50px;

            box-shadow:
                0 0 20px #ffd700;

            animation: loading 3s ease-out;
        }


        @keyframes loading {

            from {
                width: 0%;
            }

            to {
                width: 97%;
            }
        }


        /* =========================
           X BUTTON
        ========================= */

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 18px 40px;

            border-radius: 50px;

            background: #000000;

            color: white;

            text-decoration: none;

            font-family: "TT Commons Black", Arial, sans-serif;

            font-size: 22px;

            letter-spacing: 1px;

            border: 2px solid white;

            box-shadow:
                0 0 20px rgba(255,255,255,0.4);

            transition: 0.3s;
        }


        a:hover {

            background: white;

            color: black;

            transform: scale(1.1);

            box-shadow:
                0 0 30px white,
                0 0 70px #ff4fc3;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 80px;

            padding: 30px;

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 3px;

            color: rgba(255,255,255,0.5);
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="top-label">
            The future of football
        </div>


        <h1>
            SHARGI
        </h1>


        <div class="subtitle">
            Ballon D'or Loading...
        </div>


        <div class="image-container">

            <img
                src="ShargiStand.png"
                alt="Shargi"
            >

        </div>


        <div class="goat">
            The Goat Has Arrived.
        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-number">
                    99
                </div>

                <div class="stat-label">
                    AURA
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    100
                </div>

                <div class="stat-label">
                    GOAT
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    ∞
                </div>

                <div class="stat-label">
                    POTENTIAL
                </div>

            </div>

        </div>


        <div class="award">

            <div class="award-title">
                BALLON D'OR PROGRESS
            </div>

            <div class="bar">

                <div class="bar-fill"></div>

            </div>

        </div>


        <a
            href="https://x.com/Sirshargi"
            target="_blank"
        >
            𝕏 &nbsp; CHEEKY SHARGI'S TWITTER
        </a>


        <footer>
            SHARGI © 2026 · FUTURE BALLON D'OR WINNER
        </footer>


    </div>


</body>

</html>
